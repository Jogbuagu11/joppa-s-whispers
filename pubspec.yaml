name: whispers_of_joppa
description: "Whispers of Joppa - A Christian merge-2 story game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9
  flame: 1.38.2
  flame_audio: 2.12.2
  flutter_riverpod: 3.4.3
  supabase_flutter: 2.18.0
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.3
  google_mobile_ads: 9.1.0
  firebase_core: 4.15.0
  firebase_crashlytics: 5.4.0
  firebase_analytics: 12.6.0
  firebase_messaging: 16.7.0
  flutter_local_notifications: 22.3.1
  path_provider: 2.1.6
  sign_in_with_apple: 8.2.0
  google_sign_in: 7.2.0
  logging: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  image: 4.10.1

flutter:
  uses-material-design: true

  assets:
    - content/
    - assets/items/
    - assets/generators/
    - assets/characters/
    - assets/locations/
    - assets/ui/
    - assets/audio/
